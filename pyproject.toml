[project]
name = "omerta-ai"
version = "0.1.0"
description = "Omerta.ai - Agentic AI financial-crime investigation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "mcp>=1.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "neo4j>=5.26.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyyaml>=6.0.2",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "mcp_servers", "domain", "infrastructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "graph: tests that require a running Neo4j (docker compose up -d neo4j)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "mcp_servers", "domain", "infrastructure", "tests"]
extend-exclude = ["migrations/versions"]  # autogenerated Alembic revisions

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic


