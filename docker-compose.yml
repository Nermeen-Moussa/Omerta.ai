services:
  postgres:
    image: postgres:17-alpine
    container_name: omerta-postgres
    environment:
      POSTGRES_USER: omerta
      POSTGRES_PASSWORD: omerta_dev_password
      POSTGRES_DB: omerta
    ports:
      # Host port 15432: dev machines often run a native PostgreSQL on 5432
      # (and occasionally other services on nearby ports).
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omerta -d omerta"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: omerta-neo4j
    environment:
      NEO4J_AUTH: neo4j/omerta_dev_password
    ports:
      # Host ports 17474/17687: after a Windows reboot the Hyper-V winnat
      # service can reserve shifting TCP ranges (observed 7681-7780) that
      # cover 7687, preventing container startup. Fixed high ports avoid it.
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: omerta-backend
    build:
      context: .
    container_name: omerta-api
    command: >
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment:
      # Container-internal addresses (postgres/neo4j service names, default
      # ports - host port remappings above apply only from the host).
      DATABASE_URL: postgresql+asyncpg://omerta:omerta_dev_password@postgres:5432/omerta
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  neo4j_data:
